<div class="pokemon-container">
  <h2>Liste des Pokémon</h2>
  
  <!-- Filtre par type -->
  <div class="filter-section">
    <label for="type-select">Filtrer par type :</label>
    <select id="type-select" (change)="onTypeChange($event)" [value]="selectedType()">
      <option value="">Tous les types</option>
      @for (type of types(); track type.name) {
        <option [value]="type.name">{{ type.name | titlecase }}</option>
      }
    </select>
  </div>

  <!-- Liste des Pokémon -->
  <div class="pokemon-grid">
    @for (pokemon of pokemonList(); track pokemon.id) {
      <div class="pokemon-card">
        <div class="pokemon-id">#{{ pokemon.id }}</div>
        <img 
          [src]="getPokemonImage(pokemon)" 
          [alt]="pokemon.name"
          class="pokemon-image"
          loading="lazy"
        >
        <h3 class="pokemon-name">{{ pokemon.name | titlecase }}</h3>
        <div class="pokemon-types">
          @for (type of getPokemonTypes(pokemon); track type) {
            <span class="type-badge" [class]="'type-' + type">{{ type }}</span>
          }
        </div>
      </div>
    }
  </div>

  <!-- Bouton Charger plus (seulement si aucun type n'est sélectionné) -->
  @if (selectedType() === '') {
    <div class="load-more-section">
      <button class="load-more-btn" (click)="loadMore()">
        Charger plus de Pokémon
      </button>
    </div>
  }
</div>
